<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · BTU BJJ</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f4f8;
        --text: #0f1729;
        --muted: #7b849c;
        --primary: #0b3d91;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --text: #e9edf7;
          --muted: #8590ad;
          --primary: #5b93ff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
      }
      p {
        color: var(--muted);
        max-width: 320px;
      }
      button {
        font: inherit;
        font-weight: 650;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="title">No internet connection</h1>
      <p id="body">The app needs internet to load and save attendance. Check Wi-Fi or mobile data and try again.</p>
      <button id="retry" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Same language choice as the app (cookie set by the BS | EN toggle).
      var m = document.cookie.match(/(?:^|; )btu_lang=(bs|en)/)
      var bs = m ? m[1] === 'bs' : /^(bs|hr|sr|sh|cnr)\b/i.test(navigator.language || '')
      if (bs) {
        document.documentElement.lang = 'bs'
        document.title = 'Nema interneta · BTU BJJ'
        document.getElementById('title').textContent = 'Nema internet veze'
        document.getElementById('body').textContent =
          'Aplikaciji treba internet da učita i sačuva prisustvo. Provjeri Wi-Fi ili mobilne podatke i pokušaj ponovo.'
        document.getElementById('retry').textContent = 'Pokušaj ponovo'
      }
    </script>
  </body>
</html>
